name: WORK SEARCH OWNERFIX live smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/work-search-ownerfix-preview/**'
      - 'tests/wsax-ownerfix-live.mjs'
      - '.github/workflows/wsax-ownerfix-live.yml'

permissions:
  contents: read

concurrency:
  group: wsax-ownerfix-live
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install serverless Chromium harness
        run: npm install --no-save puppeteer-core@25.0.4 @sparticuz/chromium@149.0.0
      - name: Run live PWA + offline + OWNER v2 gate
        run: node tests/wsax-ownerfix-live.mjs
