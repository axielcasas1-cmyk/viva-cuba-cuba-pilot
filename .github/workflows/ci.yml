name: CI

on:
  push:
    branches:
      - main
      - 'build/**'
      - 'viva-cuba-modo-mami-canonical-20260923'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
